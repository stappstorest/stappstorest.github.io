<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StAppStore | Official Portal</title>
    <style>
        /* Rangli va zamonaviy dizayn */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        #clock { font-size: 1.5rem; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to StAppStore</h1>
        <p>Premium Mobile Applications Portal</p>
        <div id="clock"></div>
    </div>

    <script>
        // Vaqt va sanani ko'rsatish funksiyasi
        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeString = now.toLocaleTimeString();
            const dateString = now.toLocaleDateString(undefined, options);
            document.getElementById('clock').innerHTML = dateString + "<br>" + timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
