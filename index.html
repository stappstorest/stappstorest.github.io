<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StAppStore | Our Apps</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            min-height: 100vh;
        }
        h1 { color: #38bdf8; margin-top: 20px; }
        
        /* Soat dizayni */
        #clock { 
            font-size: 1.2rem; 
            margin-bottom: 30px; 
            color: #94a3b8; 
            padding: 10px;
        }

        /* Ilovalar setkasi */
        .app-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 900px; 
            margin: auto; 
        }
        .app-card { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #334155; 
            transition: 0.3s; 
        }
        .app-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .btn { 
            display: block; 
            padding: 10px; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 8px; 
            margin-top: 15px; 
        }
    </style>
</head>
<body>

    <h1>StAppStore Applications</h1>
    <div id="clock"></div>

    <div class="app-grid">
        <div class="app-card"><h3>Daqiqa</h3><a href="https://play.google.com/store/apps/details?id=com.dt.daqiqa" class="btn">Install</a></div>
        <div class="app-card"><h3>Wallpapers</h3><a href="https://play.google.com/store/apps/details?id=com.dt.wallpaperss" class="btn">Install</a></div>
        <div class="app-card"><h3>Voice Recorder</h3><a href="https://play.google.com/store/apps/details?id=com.st.voicerecorder" class="btn">Install</a></div>
        <div class="app-card"><h3>Screen Timer</h3><a href="https://play.google.com/store/apps/details?id=com.dt.screentimer" class="btn">Install</a></div>
        <div class="app-card"><h3>IPTV Player</h3><a href="https://play.google.com/store/apps/details?id=com.st.iptvplayer" class="btn">Install</a></div>
        <div class="app-card"><h3>Shaxmat</h3><a href="https://play.google.com/store/apps/details?id=com.dt.shaxmat" class="btn">Install</a></div>
        <div class="app-card"><h3>Checkers</h3><a href="https://play.google.com/store/apps/details?id=com.dt.checkers" class="btn">Install</a></div>
        <div class="app-card"><h3>Compass</h3><a href="https://play.google.com/store/apps/details?id=com.st.compassst" class="btn">Install</a></div>
        <div class="app-card"><h3>Internet Meter</h3><a href="https://play.google.com/store/apps/details?id=com.dt.internetmeter" class="btn">Install</a></div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerHTML = now.toDateString() + " | " + now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
